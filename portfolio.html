<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Portfolio - Milena Volcok</title>
    <meta name="description"
        content="Full makeup portfolio by Milena Volcok — bridal, editorial and special event looks." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "pink-soft": "#fdddf2",
                        "pink-pale": "#fef5fb",
                        "ghost": "#cbd4d3",
                        "blush": "#f3e8ec",
                    },
                    fontFamily: {
                        "sans": ["Montserrat", "sans-serif"],
                        "display": ["Anticva", "serif"],
                    },
                },
            },
        }
    </script>
    <style>
        @font-face {
            font-family: 'Anticva';
            src: url('fonts/Anticva-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
        }

        .super-header {
            position: relative;
            display: inline-block;
        }

        .super-header::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            color: #cbd4d3;
            z-index: -1;
            transform: translateY(-15px);
            white-space: nowrap;
        }

        .zoom-image {
            transition: transform .3s ease-out;
        }

        .zoom-image:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body class="text-stone-800">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-blush/95 backdrop-blur-md border-b border-stone-200/60">
        <div class="max-w-screen-2xl mx-auto px-6 py-5 flex flex-col items-center text-center relative">
            <button class="md:hidden absolute right-6 top-6"
                onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" aria-label="Menu">
                <svg class="size-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
                </svg>
            </button>
            <div class="hidden md:inline-flex flex-col items-stretch">
                <nav class="flex items-center justify-center gap-x-5 md:gap-x-6 text-base md:text-lg font-medium">
                    <a class="hover:opacity-60 transition" href="index.html#home">Home</a>
                    <span>-</span>
                    <a class="hover:opacity-60 transition" href="portfolio.html">Portfolio</a>
                    <span>-</span>
                    <a class="hover:opacity-60 transition" href="index.html#about">About</a>
                    <span>-</span>
                    <a class="hover:opacity-60 transition" href="index.html#contact">Contact</a>
                </nav>
                <div class="border-b border-black mt-2"></div>
            </div>
            <a class="font-display text-5xl md:text-6xl mt-4 md:mt-5 tracking-wide" href="index.html">Milena Volcok</a>
        </div>
        <div class="hidden md:hidden bg-blush border-t border-stone-200/60" id="mobile-menu">
            <nav class="flex flex-col items-center p-6 gap-4 text-base font-medium"
                onclick="document.getElementById('mobile-menu').classList.add('hidden')">
                <a href="index.html#home">Home</a>
                <span>-</span>
                <a href="portfolio.html">Portfolio</a>
                <span>-</span>
                <a href="index.html#about">About</a>
                <span>-</span>
                <a href="index.html#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main class="pt-40 md:pt-48 pb-16 md:pb-24 px-6">
        <div class="max-w-screen-2xl mx-auto text-center">
            <h1 class="super-header font-display text-3xl md:text-4xl tracking-widest mb-14" data-text="FULL PORTFOLIO">
                FULL PORTFOLIO</h1>
            <div class="max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 justify-items-center">
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="Lilac glam eye makeup" class="zoom-image w-full h-full object-cover"
                        src="gallery/lilac-glam.jpeg" />
                </div>
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="White eye glam makeup" class="zoom-image w-full h-full object-cover"
                        src="gallery/white-eye-glam.jpg" />
                </div>
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="Soft natural makeup look" class="zoom-image w-full h-full object-cover"
                        src="gallery/soft-natural.jpeg" />
                </div>
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="Sage green eye makeup" class="zoom-image w-full h-full object-cover"
                        src="gallery/sage-green.jpg" />
                </div>
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="Purple glitter glam makeup" class="zoom-image w-full h-full object-cover"
                        src="gallery/purple-glitter.jpeg" />
                </div>
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="Sleek winged liner makeup" class="zoom-image w-full h-full object-cover"
                        src="gallery/sleek-liner.jpeg" />
                </div>
                <div class="overflow-hidden rounded-xl shadow-lg aspect-[4/5] w-full max-w-[360px]">
                    <img alt="Nude soft glam makeup" class="zoom-image w-full h-full object-cover"
                        src="gallery/nude-glam.jpeg" />
                </div>
            </div>
            <a class="inline-block mt-14 text-sm font-medium uppercase tracking-wide hover:opacity-60 transition"
                href="index.html">← Back to Home</a>
        </div>
    </main>

        <div class="max-w-5xl mx-auto flex flex-col items-center gap-6 text-center">

            <p class="text-sm text-gray-500 max-w-md">Professional makeup artist. Bridal, editorial and special event
                makeup. Available globally.</p>
            <div class="flex gap-6 items-center">

                    </svg>
                </a>
                <a aria-label="Email" class="hover:opacity-60 transition" href="mailto:hello@milena.com">
                    <svg class="size-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M3 8l9 6 9-6M4 6h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1z"

                    </svg>
                </a>
            </div>
            <p class="text-xs text-gray-500 uppercase tracking-widest pt-4">© 2026 Milena Volcok. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
